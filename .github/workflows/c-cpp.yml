name: C/C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make build-essential
        
    - name: Build Standard
      run: |
        gcc -Wall -Wextra -Werror -O2 -pthread -o veritas veritas.c -lm
        
    - name: Build Sanitizer (Memory Checks)
      run: |
        gcc -Wall -Wextra -Werror -Wshadow -fsanitize=address,undefined -g -std=c11 -pthread -o veritas_san veritas.c -lm
        
    - name: Test execution (Help menu)
      run: |
        ./veritas --help || exit 0
